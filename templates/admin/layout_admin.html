{% extends "layout.html" %}
{% block main_class %}p-6{% endblock %}
{% block content %}

{% block admin_content %}{% endblock %}

<!-- Delete confirmation modal -->
<div id="modal-delete-confirm" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-delete-title">
  <div class="modal-card max-w-sm w-full mx-4">
    <header class="modal-header">
      <h3 id="modal-delete-title" class="text-lg font-semibold">{{ base.translate["delete"] }}</h3>
      <button class="modal-close" onclick="closeDeleteModal()" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </header>
    <div class="px-6 py-4">
      <p id="modal-delete-message" class="text-zinc-600 dark:text-zinc-300 mb-6"></p>
      <div class="flex justify-end gap-3">
        <button class="button__outline" onclick="closeDeleteModal()">{{ base.translate["cancel"] }}</button>
        <a id="modal-delete-href" href="#" class="button danger">
          <i class="fas fa-trash mr-2"></i>{{ base.translate["delete"] }}
        </a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  window.openDeleteModal = function (url, message) {
    document.getElementById('modal-delete-message').textContent = message;
    document.getElementById('modal-delete-href').href = url;
    document.getElementById('modal-delete-confirm').classList.add('is-active');
  };

  window.closeDeleteModal = function () {
    document.getElementById('modal-delete-confirm').classList.remove('is-active');
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDeleteModal();
  });

  // Live normalization for entity name inputs (mirrors normalize_name() in
  // src/services/utils.rs; the server strips leading/trailing "_" on save).
  var NAME_ACCENTS = {
    'á': 'a', 'à': 'a', 'ä': 'a', 'â': 'a',
    'é': 'e', 'è': 'e', 'ë': 'e', 'ê': 'e',
    'í': 'i', 'ì': 'i', 'ï': 'i', 'î': 'i',
    'ó': 'o', 'ò': 'o', 'ö': 'o', 'ô': 'o',
    'ú': 'u', 'ù': 'u', 'ü': 'u', 'û': 'u',
    'ñ': 'n'
  };

  function normalizeName(value) {
    return value
      .toLowerCase()
      .replace(/[áàäâéèëêíìïîóòöôúùüûñ]/g, function (ch) { return NAME_ACCENTS[ch]; })
      .replace(/\s+/g, '_')
      .replace(/[^a-z0-9_]/g, '')
      .replace(/_+/g, '_');
  }

  function applyNameNormalization(el) {
    var before = el.value;
    var after = normalizeName(before);
    if (after === before) return;
    var pos = el.selectionStart - (before.length - after.length);
    el.value = after;
    el.setSelectionRange(Math.max(0, pos), Math.max(0, pos));
  }

  document.addEventListener('input', function (e) {
    if (e.isComposing) return;
    var el = e.target;
    if (!el.matches || !el.matches('input[data-normalize-name]')) return;
    applyNameNormalization(el);
  });

  document.addEventListener('compositionend', function (e) {
    var el = e.target;
    if (!el.matches || !el.matches('input[data-normalize-name]')) return;
    applyNameNormalization(el);
  });

  // Toasts
  function ensureToastContainer() {
    var c = document.getElementById('toast-container');
    if (!c) {
      c = document.createElement('div');
      c.id = 'toast-container';
      c.className = 'toast-container';
      document.body.appendChild(c);
    }
    return c;
  }

  window.showToast = function (message, type) {
    var container = ensureToastContainer();
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'success');
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function () {
      el.remove();
    }, 4000);
  };

  // Confirms a save/apply/delete: any POST form navigates normally (no
  // fetch/htmx involved), so the confirmation has to survive that reload —
  // stash it in sessionStorage before navigating, consume it on next load.
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.tagName === 'FORM' && form.method && form.method.toLowerCase() === 'post') {
      try {
        sessionStorage.setItem('mvt-toast-pending', '1');
      } catch (err) {}
    }
  });

  var pendingToast;
  try {
    pendingToast = sessionStorage.getItem('mvt-toast-pending');
  } catch (err) {
    pendingToast = null;
  }
  if (pendingToast) {
    try {
      sessionStorage.removeItem('mvt-toast-pending');
    } catch (err) {}
    window.showToast('{{ base.translate["toast-saved"] }}', 'success');
  }

  // Required-field validation: the browser already shows a bubble on the
  // field, this just adds a toast so it's not missed. "invalid" doesn't
  // bubble, so this has to listen on the capture phase; one submit attempt
  // can fire it once per empty field, so it's debounced to a single toast.
  var invalidToastShown = false;
  document.addEventListener('invalid', function () {
    if (invalidToastShown) return;
    invalidToastShown = true;
    window.showToast('{{ base.translate["toast-required-fields"] }}', 'error');
    setTimeout(function () {
      invalidToastShown = false;
    }, 300);
  }, true);

  // Buttons that save via htmx instead of a native form submit (no page
  // reload, so the sessionStorage trick above never applies to them) opt in
  // with data-toast="save" and get their result reported here instead.
  document.body.addEventListener('htmx:afterRequest', function (evt) {
    var el = evt.detail.elt;
    if (!el || !el.matches || !el.matches('[data-toast="save"]')) return;
    if (evt.detail.successful) {
      window.showToast('{{ base.translate["toast-saved"] }}', 'success');
    } else {
      window.showToast('{{ base.translate["toast-save-failed"] }}', 'error');
    }
  });
})();
</script>
{% endblock %}
